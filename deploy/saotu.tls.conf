server {
 listen 80;
 server_name saotu.osh.lol;
 location /.well-known/acme-challenge/ { root /opt/saotu-osh/acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl http2;
 server_name saotu.osh.lol;
 ssl_certificate /www/server/panel/vhost/cert/saotu.osh.lol/fullchain.pem;
 ssl_certificate_key /www/server/panel/vhost/cert/saotu.osh.lol/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 16m;
 gzip on;
 gzip_types text/css application/javascript application/json;
 location / {
  proxy_pass http://127.0.0.1:18887;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 50s;
 }
}
